<!DOCTYPE html>
<html>
<head>
  <title>DOM Exercises</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>The Best Game Ever</h1>

  <h2 class="sub-header">DOM Intro Exercises</h2>

  <section>
    <h2>Exercise 1 - Ball Game</h2>

    <div id="container">
      <div id="playing-field">
        <div id="ball"></div>
      </div>

      <div id="arrows">
        <div id="up">⬆</div>
        <div id="left">⬅</div>
        <div id="down">⬇</div>
        <div id="right">➡</div>
      </div>
    </div>
  </section>

  <section>
    <h2>Exercise 2 - Reservations</h2>

    <input id="reservation-input" placeholder="Enter name">
    <button id="reservation-btn">Check Reservation</button>
    <p id="reservation-message"></p>
  </section>

  <section>
    <h2>Exercise 3 - Visual Overload</h2>

    <div id="boxes-container"></div>
  </section>

  <section>
    <h2>Exercise 4 - Form</h2>

    <div id="form-container">
      <input id="name-input" placeholder="Name">
      <input id="salary-input" placeholder="Salary">
      <input id="birthday-input" type="date">
      <input id="phone-input" placeholder="Phone">

      <button id="submit-btn">Submit</button>
    </div>

    <div id="errors"></div>
    <h2 id="welcome-message"></h2>
  </section>

  <script src="main.js"></script>
</body>
</html>
